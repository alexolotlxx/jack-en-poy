<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rock-Paper-Scissors</title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Amarante&family=Press+Start+2P&display=swap" rel="stylesheet">
    </head>
    <body>
        <p class="tagline">Your nostalgic Filipino game</p>
        <h1 class="title">JACK EN POY!</h1>
        <h2 id="round-indicator"></h2>
        <div id="game-screen">
            <p id="upper-text"></p>
            <p id="middle-text">Press START to begin!</p>
            <p id="bottom-text"></p>
        </div>
        <div class="container">  
            <button class="start-button">START</button>
        </div>
        <div class="footer">
            <p id="user-score" class="score user-score">Your Score: 0/5</p>
            <p id="bot-score" class="score bot-score">Bot's Score: 0/5</p>
        </div>
        <p class="copyright">Copyright © 2026 alexolotlxx<a href="https://github.com/alexolotlxx"><img class="github" src="images/github-icon.svg"></a></p>
    </body>
</html>
